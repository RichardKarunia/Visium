	<head>
		<meta charset="utf-8">

		<title>VISIUM</title>
		<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
		<link rel="stylesheet" href="stylegallery.css">

	</head>
	<body>
    
    <div style="width: 100%; height: 100vh"></div>

		<!-- IMAGE TRAIL -->
		<img class="image" data-index="0" data-status="inactive" src="photos/c1.jpg" />
        <img class="image" data-index="1" data-status="inactive" src="photos/c2.jpg" />
        <img class="image" data-index="2" data-status="inactive" src="photos/c3.jpg" />
		<img class="image" data-index="3" data-status="inactive" src="photos/c4.jpg" />
		<img class="image" data-index="4" data-status="inactive" src="photos/c5.jpg" />
		<img class="image" data-index="5" data-status="inactive" src="photos/c6.jpg" />
		<img class="image" data-index="6" data-status="inactive" src="photos/c7.jpg" />
		<img class="image" data-index="7" data-status="inactive" src="photos/c8.jpg" />
		<img class="image" data-index="8" data-status="inactive" src="photos/c9.jpg" />
		<img class="image" data-index="9" data-status="inactive" src="photos/c10.jpg" />
		<img class="image" data-index="10" data-status="inactive" src="photos/c11.jpg" />
		<img class="image" data-index="11" data-status="inactive" src="photos/c12.jpg" />
		<img class="image" data-index="12" data-status="inactive" src="photos/c13.jpg" />
        <img class="image" data-index="13" data-status="inactive" src="photos/c14.jpg" />
		
		<script>
		const images = document.getElementsByClassName("image");

		let globalIndex = 0,
			last = { x: 0, y: 0 };

		const activate = (image, x, y) => {
		  image.style.left = `${x}px`;
		  image.style.top = `${y}px`;
		  image.style.zIndex = globalIndex;

		  image.dataset.status = "active";

		  last = { x, y };
		}

		const distanceFromLast = (x, y) => {
		  return Math.hypot(x - last.x, y - last.y);
		}
		
		const getY = (y) => {
			return last.y;
		}
	
		const handleOnMove = e => {
			
			  if(distanceFromLast(e.clientX, e.clientY) > (window.innerWidth / 15)) {
				const lead = images[globalIndex % images.length],
					  tail = images[(globalIndex - 5) % images.length];

				activate(lead, e.clientX, e.clientY);

				if(tail) tail.dataset.status = "inactive";
				
				globalIndex++;
			  }
			
			if(getY(e.clientY) < 50 || getY(e.clientY) > 620) {
				i = 0;
				while(i<=13) {
					const curr = images[i % images.length]
					curr.dataset.status = "off";
					i++;
				}
			}
		}

		window.onmousemove = e => handleOnMove(e);

		window.ontouchmove = e => handleOnMove(e.touches[0]);
	</script>
